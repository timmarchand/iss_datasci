project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!slides/"
    - "!lesson/"
    - "!content_zips_staging/"
    - "!exercises/"
    - "!files/projects/"
  resources:
    - "files/"
    - "projects/"
    - "slides/*.html"
    - "slides/*.pdf"
    - "slides/img/"
    - "slides/libs/"
    - "slides/css/"
    - "slides/*_files/"
  preview:
    port: 3334

execute:
  freeze: auto

bibliography: files/bib/readings.bib
csl: files/bib/chicago-author-date.csl

website:
  title: "CLIL Seminar: Data Science"
  description: "Course materials for ISS Data Science Course at Gakushuin University"
  site-url: "https://timmarchand.github.io/ISS_datasci/"
  repo-url: "https://github.com/timmarchand/ISS_datasci"

  draft-mode: unlinked
  favicon: "/files/favicon-512.png"
  page-navigation: true

  navbar:
    pinned: true
    background: "#1a4d2e"
    right:
      - syllabus.qmd
      - schedule.qmd
      - text: "Content"
        href: content/index.qmd
      # - text: "Lessons"
      #   href: lesson/index.qmd
      - text: "Projects"
        href: project/index.qmd
      - text: "Videos"
        href: example/index.qmd
      - text: "Assignments"
        href: assignment/index.qmd
      - text: "Resources"
        href: resource/index.qmd
      - icon: mortarboard-fill
        href: "https://moodle.univ.gakushuin.ac.jp/course/view.php?id=26121"
        aria-label: Moodle

  sidebar:
    - title: "Content"
      style: "docked"
      search: false
      contents:
        - section: "Overview"
          contents:
            - content/index.qmd
        - section: "Foundations"
          contents:
            - content/01-content.qmd
            - content/02-content.qmd
            - content/03-content.qmd
        - section: "Core Concepts"
          contents:
            - content/04-content.qmd
            - content/05-content.qmd
            - content/06-content.qmd
            - content/07-content.qmd
            - content/08-content.qmd
            - content/09-content.qmd
        - section: "Advanced Topics"
          contents:
            - content/10-content.qmd
            - content/11-content.qmd
            - content/12-content.qmd
        - section: "Project"
          contents:
            - content/13-content.qmd

    - title: "Lessons"
      contents:
        - section: "Overview"
          contents:
            - lesson/index.qmd
        - section: "Foundations"
          contents:
            - text: "1: Course introduction, data types, R and RStudio"
